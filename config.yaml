# Agent Army runtime configuration.
#
# This file selects which coding-agent CLI executes role cards. Everything else
# about a run -- role cards, GitHub Apps, output schemas -- is unchanged by this
# choice. Both backends are held to the same JSON Schemas in schemas/, so the
# orchestrator's validators and publishers cannot tell them apart.
#
# Settings here are the repository-wide default. Each agent may override them in
# its own agents/<role>/agent-config.yaml under a `runtime:` section, and
# --backend on any entry point overrides both for a single run:
#
#   --backend flag  >  agent-config.yaml  >  config.yaml  >  built-in defaults

# Which CLI runs role cards: "codex" or "claude".
backend: codex

backends:
  codex:
    # Codex sandbox profile. "workspace-write" confines writes to the workspace
    # and denies network access, which is what the untrusted-work-item prompt
    # framing assumes. Only widen this deliberately.
    sandbox: workspace-write

    # Reserved: not yet wired into the Codex command line. Dummy placeholders
    # so this section carries the same shape as backends.claude.
    model: o3
    reasoning_effort: medium

  claude:
    # Claude Code has no OS-level sandbox equivalent to Codex's workspace-write,
    # so confinement comes from the permission mode instead:
    #
    #   acceptEdits       File edits apply without prompting. Other tools follow
    #                     the normal permission rules, including any allowlist in
    #                     ~/.claude/settings.json; anything still requiring a
    #                     prompt is denied, because -p mode cannot answer one.
    #                     Denials are reported rather than silently dropped.
    #   bypassPermissions No confinement at all. Prefer this only when the
    #                     workspace is disposable -- the orchestrator's isolated
    #                     git worktree qualifies.
    #   dontAsk / auto    Intermediate; see `claude --help`.
    #
    # Set deliberately to bypassPermissions: this project accepts running Claude
    # unconfined in exchange for capability parity with Codex. Orchestrated runs
    # execute in isolated git worktrees; direct `execute-agent --workspace .`
    # runs do not, so point it at a workspace you are willing to lose.
    permission_mode: bypassPermissions

    # Pin a model, or leave empty to use the Claude Code default.
    model: claude-haiku-4-5-20251001

    # Reasoning effort: low, medium, high, xhigh, or max. Leave empty to use
    # the Claude Code default.
    effort: low

    # Known asymmetry, accepted: Claude Code loads CLAUDE.md, user settings,
    # hooks, and skills from the workspace and ~/.claude, while Codex runs with
    # --ephemeral and sees none of it. Claude's --bare flag would suppress that,
    # but it also forces ANTHROPIC_API_KEY-only auth, which cannot work while
    # provider keys are stripped from the agent environment.

# Where GitHub App private keys are read from.
#
#   pass  Encrypted at rest in the password store, but decrypting needs an
#         interactive GPG unlock -- gpg-agent's cache expires, and a headless
#         process has no TTY for pinentry, so long unattended runs stall.
#   env   Read from the environment, falling back to the env_file below. Each
#         key's variable name is derived from its secret ref:
#         agent-army/project-owner/github-app-private-key becomes
#         AGENT_ARMY_PROJECT_OWNER_GITHUB_APP_PRIVATE_KEY. The value may be the
#         PEM itself (newlines may be written as \n) or a path to the .pem file.
#
# "env" trades pass's at-rest encryption for unattended operation: the key
# becomes readable by anything running as this user. Keep the file out of
# version control (.env is gitignored) and restrict it with chmod 600.
credentials:
  source: pass
  env_file: .env
