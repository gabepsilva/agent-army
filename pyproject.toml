[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-army"
version = "0.1.0"
description = "Runtime foundation for GitHub-backed agents"
requires-python = ">=3.11"
dependencies = [
  "PyJWT[crypto]>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
verify-documentation-agent = "agent_army.verify_documentation_agent:main"
read-work-item = "agent_army.read_work_item:main"
read-documentation-task = "agent_army.read_documentation_task:main"
execute-agent = "agent_army.execute_agent:main"
publish-documentation-analysis = "agent_army.publish_documentation_analysis:main"
run-documentation-agent = "agent_army.run_documentation_agent:main"
run-orchestrator = "agent_army.run_orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]
