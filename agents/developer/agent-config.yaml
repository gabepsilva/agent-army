# Credential-ready configuration for the Developer agent.
# Public identifiers for the Developer GitHub App.
# Store only the private key in pass at private_key_secret_ref; never commit it.

agent:
  name: developer
  role_file: ROLE.md
  invocation_modes:
    - issue_implementation

github_app:
  app_id: 4579193
  client_id: Iv23liI49S3fuutyV3Nu
  private_key_secret_ref: agent-army/developer/github-app-private-key

# Which coding-agent CLI runs this role. Every key is optional and layers over
# the repository-wide defaults in config.yaml; a --backend flag beats both.
runtime:
  backend: claude
  codex:
    sandbox: workspace-write
    model: o3
    reasoning_effort: medium
  claude:
    permission_mode: bypassPermissions
    model: claude-haiku-4-5-20251001
    # `claude --effort` accepts low|medium|high|xhigh|max -- there is no "none",
    # so thinking cannot be disabled outright. low is the floor.
    effort: low
