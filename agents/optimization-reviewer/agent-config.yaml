# Credential-ready configuration for the Optimization Reviewer agent.
# Public identifiers for the Optimization Reviewer GitHub App.
# Store only the private key in pass at private_key_secret_ref; never commit it.

agent:
  name: optimization-reviewer
  role_file: ROLE.md
  invocation_modes:
    - pull_request_review
    - requirements_challenge

github_app:
  app_id: 4287312
  client_id: Iv23lizPwnN2k9WRpmvp
  private_key_secret_ref: agent-army/optimization-reviewer/github-app-private-key

# Which coding-agent CLI runs this role. Every key is optional and layers over
# the repository-wide defaults in config.yaml; a --backend flag beats both.
runtime:
  backend: claude
  codex:
    sandbox: workspace-write
    model: o3
    reasoning_effort: medium
  claude:
    permission_mode: bypassPermissions
    model: claude-haiku-4-5-20251001
    # `claude --effort` accepts low|medium|high|xhigh|max -- there is no "none",
    # so thinking cannot be disabled outright. low is the floor.
    effort: low
