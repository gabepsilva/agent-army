# Credential-ready configuration for the Project Owner agent.
# Add public GitHub App identifiers after the App is created.
# Store only the private key in pass; never commit private-key material.

agent:
  name: project-owner
  role_file: ROLE.md
  invocation_modes:
    - issue_intake
    - decision_review
    - specialist_question_resolution

github_app:
  app_id: 4578638
  client_id: Iv23li4AwbIV5S32dZyJ
  private_key_secret_ref: agent-army/project-owner/github-app-private-key

# Which coding-agent CLI runs this role. Every key is optional and layers over
# the repository-wide defaults in config.yaml; a --backend flag beats both.
runtime:
  backend: claude
  codex:
    sandbox: workspace-write
    model: o3
    reasoning_effort: medium
  claude:
    permission_mode: bypassPermissions
    model: claude-haiku-4-5-20251001
    # `claude --effort` accepts low|medium|high|xhigh|max -- there is no "none",
    # so thinking cannot be disabled outright. low is the floor.
    effort: low
